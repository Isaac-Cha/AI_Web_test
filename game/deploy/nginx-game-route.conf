# ============ Nginx: 办二游戏路由片段（三隔离）============
# 粘贴到 server {} 块（宝塔：/www/server/panel/vhost/nginx/cg-fintech.com.conf）
# 原站 `location /` 和 `location /api` 保持不动；以下 3 个 location 新增即可

# 1. 游戏前端 SPA（静态 build 放在 /www/wwwroot/cg-fintech.com/game/）
location ^~ /game/ {
    alias /www/wwwroot/cg-fintech.com/game/;
    index index.html;
    try_files $uri $uri/ /game/index.html;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, must-revalidate";

    # 子路径下 /game/static/* 给更长缓存
    location ~* /game/static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

# 2. 游戏后端 HTTP API（独立进程 127.0.0.1:8001）
location ^~ /game/api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# 3. 游戏 WebSocket（/game/ws/{room_id}/{player_id} → 后端同端口）
location ^~ /game/ws/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 3600s;          # 长时间对局：1 小时
    proxy_send_timeout 3600s;
}
