name: Deploy backend to VPS (git pull + restart)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Emergent/backend/**'
      - '.github/workflows/deploy-backend-vps.yml'

concurrency:
  group: deploy-backend-vps
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - name: Validate secrets
        run: |
          set -e
          for name in VPS_HOST VPS_USER VPS_PASSWORD VPS_PORT; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Deploy backend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            APP_DIR=/opt/emergent/Emergent
            BACKEND_DIR="$APP_DIR/Emergent/backend"
            BACKUP_DIR=/root/emergent-backups

            echo "== 1/5 backup current backend =="
            mkdir -p "$BACKUP_DIR"
            STAMP=$(date +%Y%m%d-%H%M%S)
            tar czf "$BACKUP_DIR/backend-$STAMP.tar.gz" \
              -C "$APP_DIR" --exclude='.venv' --exclude='__pycache__' Emergent/backend
            ls -lh "$BACKUP_DIR/backend-$STAMP.tar.gz"
            ls -1t "$BACKUP_DIR"/backend-*.tar.gz | tail -n +11 | xargs -r rm -f

            echo "== 2/5 fetch and reset to origin/main =="
            cd "$APP_DIR"
            git fetch --all --prune
            git checkout -- .
            git reset --hard origin/main
            git --no-pager log --oneline -3

            echo "== 3/5 install backend requirements =="
            cd "$BACKEND_DIR"
            .venv/bin/pip install -q -r requirements.txt

            echo "== 4/5 restart service =="
            systemctl restart emergent-api
            for i in $(seq 1 10); do
              if systemctl is-active --quiet emergent-api; then break; fi
              sleep 2
            done
            systemctl is-active emergent-api

            echo "== 5/5 health check =="
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:8000/api/health
            echo
            for path in "eas?limit=1" "indicators?limit=1" "articles?limit=1" "research?limit=1"; do
              printf "/api/%s -> " "$path"
              curl -sS -o /dev/null -w "%{http_code}\n" "http://127.0.0.1:8000/api/$path"
            done
            echo "== deploy finished =="
