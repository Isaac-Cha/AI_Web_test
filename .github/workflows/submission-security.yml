name: Submission security regression

on:
  push:
    paths:
      - 'Emergent/backend/**'
      - 'Emergent/frontend/**'
      - '.github/workflows/submission-security.yml'
  pull_request:
    paths:
      - 'Emergent/backend/**'
      - 'Emergent/frontend/**'
      - '.github/workflows/submission-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r Emergent/backend/tests/requirements-security.txt
      - run: python -m pytest Emergent/backend/tests/test_submission_security.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Emergent/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Emergent/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:security-policy
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
